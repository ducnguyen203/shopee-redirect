<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>

  <!-- Open Graph -->
  <meta property="og:type" content="website"/>

  <!-- Không dùng ký tự invisible -->
  <meta property="og:title" content=""/>

  <!-- Không description -->
  <meta property="og:description" content=""/>

  <!-- Không site name -->
  <meta property="og:site_name" content=""/>

  <!-- URL thật -->
  <meta property="og:url"
        content="https://fb.blogs.id.vn/"/>

  <!-- Ảnh -->
  <meta property="og:image"
        content="https://i.ibb.co/XfdpHFZ6/685949564-122152862864988292-8713902762908773700-n.jpg"/>

  <!-- Ratio Facebook thích -->
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>

  <meta property="og:image:type" content="image/jpeg"/>

  <!-- Optional -->
  <meta name="theme-color" content="#000000"/>

  <!-- Không index -->
  <meta name="robots"
        content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>

  <!-- Title HTML cũng để trống -->
  <title></title>

</head>

<body>

<script>
(function () {

  const ua = navigator.userAgent.toLowerCase();

  const isBot =
    ua.includes("facebookexternalhit") ||
    ua.includes("facebot") ||
    ua.includes("facebookcatalog");

  // User thật -> redirect
  if (!isBot) {

    setTimeout(() => {

      window.location.replace(
        "https://s.shopee.vn/7VD4VuWgDW"
      );

    }, 120);

  }

})();
</script>

</body>
</html>
